<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jordan - Drone Cinematographer & Music Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <img
        class="hero__background"
        src="https://images.unsplash.com/photo-1518176258769-f227c798150e?auto=format&fit=crop&w=1600&q=80"
        alt="Drone view landscape"
      />
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <img
          class="profile-photo"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=320&q=80"
          alt="Profile portrait"
        />
        <h1>Hi, I'm Jordan</h1>
        <p class="bio">
          I love capturing smooth drone shots, creating music content, and
          building projects on the web.
        </p>
        <div class="link-buttons">
          <a
            href="https://instagram.com/your-drone-handle"
            target="_blank"
            rel="noopener noreferrer"
          >
            Drone Instagram
          </a>
          <a
            href="https://youtube.com/@your-music-channel"
            target="_blank"
            rel="noopener noreferrer"
          >
            Music YouTube
          </a>
          <a
            href="https://github.com/your-github-username"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="skills-card">
        <h2>Skills</h2>
        <ul class="skills-list">
          <li>Drone Cinematography</li>
          <li>Video Editing</li>
          <li>Music Production</li>
          <li>Front-end Web Development</li>
          <li>Creative Storytelling</li>
        </ul>
      </section>
    </main>
  </body>
</html>
